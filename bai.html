<script src="du-lieu/bai-viet.js?v=d2145c5d"></script>
<script src="chung.js?v=aa535b6d"></script>
<script>
(function () {
  var posts = loadPosts().sort(byDateDesc), byId = {};
  posts.forEach(function (p) { byId[p.id] = p; });
  // Trang tĩnh của bài gán window.BAI_ID; link cũ dạng bai.html?id=… thì chuyển sang trang tĩnh.
  var id = window.BAI_ID || new URLSearchParams(location.search).get('id') || '';
  var p = byId[id];
  if (!window.BAI_ID && p) { location.replace(postHref(id)); return; }
  themeInit();
  var box = $('#search'), q = $('#q');
  $('#b-search').addEventListener('click', function () { var on = box.classList.toggle('on'); this.setAttribute('aria-expanded', on); if (on) q.focus(); });
  q.addEventListener('keydown', function (e) { if (e.key === 'Enter' && q.value.trim()) location.href = 'index.html?q=' + encodeURIComponent(q.value.trim()) + '#moi-nhat'; });
  if (!p) { $('#bai').innerHTML = '<header class="art"><h1>Không tìm thấy bài viết</h1><p class="lead">Bài có thể đã được gỡ. <a href="index.html">Về trang chủ</a></p></header>'; return; }
  document.querySelectorAll('#nav a').forEach(function (a) { if (a.getAttribute('href').indexOf('muc=' + p.kind + '#') > 0) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#bai').innerHTML = postHTML(p, posts);
  var photos = p.photos.map(function (ph) { return { id: ph.id, caption: ph.caption, post: p }; });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-aphoto]'); if (b) return openLB(photos, +b.dataset.aphoto, p.id);
    var c = e.target.closest('[data-act="copy"]'); if (c) copyLink(c);
  });
  initLightbox();
  Peek.init(function (x) { return byId[x]; });
  fitAll();
})();
</script>
</body>
</html>
